name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all agents + dev tools
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (contracts, planner, policies, end-to-end flows)
        run: pytest
      - name: Docker images build
        run: docker compose build
