version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# L&T Files Assistant — Full Stack, Single Command
#
#   cd backend
#   docker compose -f docker-compose.prod.yml up -d --build
#
# This file lives in backend/ and builds the frontend from ../frontend. The project name is
# pinned below so it doesn't default to the folder name ("backend"), which other projects on
# the same Docker host could share.
#
# Starts everything needed to run the app: Elasticsearch, Redis, MySQL, the
# backend API, the task_executor worker, and the frontend — replacing the 4
# separate terminals (vite, docker-compose infra-only, task_executor, uvicorn)
# used during development. This file is intentionally separate from
# backend/docker/docker-compose-lt.yml (infra-only, used for local dev) — that
# file is untouched and still works exactly as before.
# ─────────────────────────────────────────────────────────────────────────────

name: tasnim

services:

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: lt_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      # Bound to 127.0.0.1 (host-only) instead of 0.0.0.0 — Elasticsearch must never be reachable
      # from the network/internet. Inter-container traffic uses the ltnet network, not this
      # published port, so binding to localhost changes nothing for the app; it only keeps the
      # port accessible for local debugging on this machine while closing external exposure.
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v red"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks: [ltnet]

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lt_redis
    # --requirepass matches service_conf.yaml.template's own REDIS_PASSWORD default
    # (infini_rag_flow) — POSIX "${VAR:-default}" treats an empty env var the same as unset, so
    # trying to override REDIS_PASSWORD to "" in the backend/task_executor services (as
    # attempted originally) can't actually produce an empty password in the generated config; it
    # silently falls back to this same default regardless. Matching the container's real
    # password to that default is the correct fix, not fighting the template's syntax.
    command: redis-server --save 60 1 --loglevel warning --requirepass infini_rag_flow
    volumes:
      - redis_data:/data
    ports:
      # Host-only (see Elasticsearch note above) — Redis must not be internet-reachable.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "infini_rag_flow", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [ltnet]

  # ── MySQL ─────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: lt_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=infini_rag_flow
      - MYSQL_DATABASE=rag_flow
      - MYSQL_USER=rag_flow
      - MYSQL_PASSWORD=infini_rag_flow
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Host-only (see Elasticsearch note above) — MySQL must not be internet-reachable.
      - "127.0.0.1:3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=1073741824
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pinfini_rag_flow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [ltnet]

  # ── MinIO ─────────────────────────────────────────────────────────────────────
  # This app's own upload endpoint uses local-disk storage (STORAGE_BACKEND=local in
  # backend/.env) — but RAGFlow's core internals still use MinIO unconditionally for their own
  # storage needs (e.g. thumbnails/images produced during parsing) regardless of that setting.
  # Without this running, backend/task_executor logs "Fail to connect ${MINIO_HOST:-minio}:9000".
  minio:
    image: minio/minio:latest
    container_name: lt_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=rag_flow
      - MINIO_ROOT_PASSWORD=infini_rag_flow
    volumes:
      - minio_data:/data
    ports:
      # Host-only (see Elasticsearch note above) — MinIO API (9000) and console (9001) must not be
      # internet-reachable.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [ltnet]

  # ── Backend API (FastAPI / uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.lt
    container_name: lt_backend
    env_file:
      - .env
    environment:
      # Only these two need overriding here — their backend/.env values (localhost) are correct
      # for local dev but unreachable from inside this container. Every other Docker-network
      # credential (MYSQL_HOST, REDIS_HOST/PASSWORD, ES_CORE_HOST, MINIO_HOST, etc.) now lives
      # directly in backend/.env (loaded via env_file above) instead of being duplicated here.
      - ES_HOST=http://elasticsearch:9200
      - REDIS_URL=redis://:infini_rag_flow@redis:6379/0
      # torch/onnxruntime/numpy each default to using ALL host CPU cores for their own internal
      # threading — with 2 uvicorn workers (each loading its own copy of the BGE embedding/rerank
      # models) plus task_executor and Elasticsearch all doing the same simultaneously, this
      # caused severe CPU oversubscription, slowing down every endpoint (not just doc-heavy ones)
      # after torch/transformers/FlagEmbedding were added. Capping thread counts here prevents
      # any single process from monopolizing all cores.
      # Fixed: was empty ("OMP_NUM_THREADS="), which libgomp rejects ("Invalid value for
      # environment variable OMP_NUM_THREADS") on every torch import. 4 is plenty now that
      # embedding/reranking run on the GPU rather than the CPU.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
      # Ollama runs on the Windows host; the container reaches it via host.docker.internal
      # (mapped by extra_hosts below). Overrides backend/.env's localhost value for Docker.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    # Reduced from 2 workers to 1 — 2 workers meant the embedding/rerank models were loaded into
    # memory twice and both processes competed for CPU during every inference call. FastAPI's own
    # async handling covers request concurrency without needing a second full worker process here.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # Grant the NVIDIA GPU so FlagEmbedding (embedding + reranker) runs on CUDA.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Lets the container resolve host.docker.internal to the Windows host (for host-run Ollama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lt_app_data:/app/data
      - lt_model_cache:/app/backend/rag/res/deepdoc
      - lt_hf_cache:/root/.cache/huggingface
    ports:
      # Host-only — the frontend's nginx reaches the backend over the ltnet Docker network
      # (proxy_pass http://backend:8000), NOT via this published port, so the UI is unaffected.
      # This just closes direct external access to the raw API; only the frontend (port 80) needs
      # to be publicly reachable. Still accessible at localhost:8000 for local debugging / API docs.
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks: [ltnet]

  # ── Task executor (background document parsing/embedding worker) ───────────────
  # Same image as the backend — just a different process. This is what replaces the
  # "python -m rag.svr.task_executor" terminal you were running manually.
  task_executor:
    build:
      context: .
      dockerfile: Dockerfile.lt
    # No fixed container_name — this service runs multiple replicas (see deploy.replicas below),
    # which each need a unique container name (Compose auto-names them task_executor-1/2/3).
    env_file:
      - .env
    environment:
      # Same rationale as the backend service above — only ES_HOST/REDIS_URL need overriding;
      # the rest come from backend/.env via env_file.
      - ES_HOST=http://elasticsearch:9200
      - REDIS_URL=redis://:infini_rag_flow@redis:6379/0
      - PYTHONPATH=/app/backend
      # Parsing (layout/table/sklearn) is CPU-bound. ~6 threads per replica lets the 3 parallel
      # replicas below spread across the 24 cores (3 x 6 = 18) without heavy oversubscription,
      # leaving cores for the API, Elasticsearch, and the OS.
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - TOKENIZERS_PARALLELISM=false
      # Ollama runs on the Windows host; reach it via host.docker.internal (extra_hosts below).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Allow this process to also pipeline a couple of tasks around the single heavy parse
      # (fetch/embed/index while parsing) — the chunk-builder itself stays serialized per process
      # (safe), and real parse parallelism comes from running multiple replicas below.
      - MAX_CONCURRENT_TASKS=4
    # Unique consumer index per replica ($$ escapes Compose so the container's shell expands
    # $(hostname) at runtime → a distinct name per replica). All replicas share ONE Redis consumer
    # group, so each pulls DIFFERENT parse tasks — no duplication, no double-processing.
    command: ["sh", "-c", "python -m rag.svr.task_executor -i $$(hostname)"]
    # Run MULTIPLE parser processes so several document page-batches parse IN PARALLEL. This is the
    # biggest throughput win: RAGFlow serializes the heavy chunk-builder to 1 per process
    # (MAX_CONCURRENT_CHUNK_BUILDERS=1), so parallelism must come from more processes. 3 replicas
    # ≈ 3x parsing throughput. Each loads its own GPU models (~4.5GB); with Ollama (~20GB) also
    # resident this stays within the 48GB VRAM budget. Lower to 2 if VRAM gets tight, raise to 4
    # if you're not running large chats at the same time.
    deploy:
      replicas: 3
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Overrides Dockerfile.lt's inherited HEALTHCHECK, which curls the uvicorn HTTP endpoint —
    # task_executor is a background worker with no HTTP server, so that check can never pass and
    # always shows "unhealthy" even when the worker is running correctly (see logs).
    healthcheck:
      disable: true
    working_dir: /app/backend
    volumes:
      - lt_app_data:/app/data
      - lt_model_cache:/app/backend/rag/res/deepdoc
      - lt_hf_cache:/root/.cache/huggingface
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks: [ltnet]

  # ── Frontend (React build, served via nginx) ────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lt_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [ltnet]

networks:
  ltnet:
    name: lt_network

volumes:
  es_data:
    name: lt_es_data
  redis_data:
    name: lt_redis_data
  mysql_data:
    name: lt_mysql_data
  minio_data:
    name: lt_minio_data
  lt_app_data:
    name: lt_app_data
  lt_model_cache:
    name: lt_model_cache
  lt_hf_cache:
    name: lt_hf_cache
