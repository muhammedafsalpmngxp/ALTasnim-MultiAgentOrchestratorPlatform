# All agent deployments, each in its own container and port.
#
#   cd backend
#   docker compose up --build              # ports: <AGENT>_PORT in backend/.env (8100, 8201-8204)
#   docker compose --profile mail up       # + Mailpit (EMAIL_CHANNEL=smtp), UI http://localhost:8025
#
# Configuration comes from the one backend/.env (all agents; template .env.example). Values under
# `environment:` override it. The Rag agent has its own compose (Rag-agent/docker-compose.yml), same .env.
name: altasnim-agents

x-agent: &agent
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  web-search-agent:
    <<: *agent
    build: { context: ., dockerfile: web_search_agent/Dockerfile }
    image: altasnim/web-search-agent
    ports: ["${WEB_SEARCH_PORT:-8201}:${WEB_SEARCH_PORT:-8201}"]
    environment:
      WEB_SEARCH_PORT: ${WEB_SEARCH_PORT:-8201}   # listen port = mapped port
    volumes:
      - ./web_search_agent/models:/app/web_search_agent/models   # the reranker, downloaded once
      - ./web_search_agent/logs:/app/web_search_agent/logs       # saved runs for Retry

  communication-agent:
    <<: *agent
    build: { context: ., dockerfile: communication-agent/Dockerfile }
    ports: ["${COMMUNICATION_PORT:-8202}:${COMMUNICATION_PORT:-8202}"]
    environment:
      COMMUNICATION_PORT: ${COMMUNICATION_PORT:-8202}
      EMAIL_SMTP_HOST: mailpit

  verifier-agent:
    <<: *agent
    build: { context: ., dockerfile: verifier-agent/Dockerfile }
    ports: ["${VERIFIER_PORT:-8203}:${VERIFIER_PORT:-8203}"]
    environment:
      VERIFIER_PORT: ${VERIFIER_PORT:-8203}

  synthesizer-agent:
    <<: *agent
    build: { context: ./Synthesizer-agent }   # self-contained: only this agent's folder
    ports: ["${SYNTHESIZER_PORT:-8204}:${SYNTHESIZER_PORT:-8204}"]
    environment:
      SYNTHESIZER_PORT: ${SYNTHESIZER_PORT:-8204}
      SYNTHESIZER_RELOAD: "false"

  orchestrator-agent:
    <<: *agent
    build: { context: ., dockerfile: orchestrator-agent/Dockerfile }
    ports: ["${ORCHESTRATOR_PORT:-8100}:${ORCHESTRATOR_PORT:-8100}"]
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8100}
      AGENT_TRANSPORT: remote
      AGENT_WEB_SEARCH_URL: http://web-search-agent:${WEB_SEARCH_PORT:-8201}
      AGENT_COMMUNICATION_URL: http://communication-agent:${COMMUNICATION_PORT:-8202}
      AGENT_VERIFIER_URL: http://verifier-agent:${VERIFIER_PORT:-8203}
    depends_on:
      web-search-agent: { condition: service_healthy }
      communication-agent: { condition: service_healthy }
      verifier-agent: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports: ["1025:1025", "8025:8025"]
