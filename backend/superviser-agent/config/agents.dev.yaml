# The agents of the supervisor. Every enabled agent is a node of the supervisor graph, and every agent is a
# LangGraph deployment ({"task": AgentTask} in, {"result": {...}} out). The supervisor plans which nodes run,
# in which order, and passes each one's output to the next:
#
#   question -> rag (the user's documents) | web_search (the web) -> verifier -> synthesizer -> answer
#
# port + graph_id: where the agent listens and its graph (called via /threads/{id}/runs). The supervisor finds
# the machine on the network itself (no IPs). backend/.env overrides (section superviser-agent):
# AGENT_<NAME>=PORT, AGENT_<NAME>_URL=http://host:port pins a machine, AGENT_SUBNET = the networks searched.
#
# transport (env AGENT_TRANSPORT):
#   remote - every agent on its own port/machine (backend/.env sets this)
#   local  - agents with local_graph run in-process (no servers; development and tests only)
#
# card: planning fields merged over the agent's own GET /card (for agents whose card lacks them), e.g. its role
# (source | transform | final_answer | verifier | action). The supervisor's LLM plans from these cards.
# To add an agent: add an entry here (enabled: false until it is ready).
transport: local

agents:
  web_search:
    enabled: true
    port: 8201
    graph_id: web_search
    local_graph: web_search_agent.graph:graph
    local_card: web_search_agent.card:CARD
    card:
      role: source        # also on its own card; here so older images on the network are planned the same

  rag:
    enabled: true
    port: 8000
    graph_id: rag
    card:
      role: source

  verifier:
    enabled: true
    port: 8203
    graph_id: verifier
    local_graph: verifier_agent.graph:graph
    local_card: verifier_agent.card:CARD
    card:
      role: verifier

  synthesizer:
    enabled: true
    port: 8204
    graph_id: synthesizer
    card:
      role: final_answer  # its answer is the reply
      when_to_use: >-
        Always the last step of a question: writes ONE clear final answer from the outputs of the earlier steps
        (depends_on them).
      when_not_to_use: Finding facts (use rag or web_search first); sending messages.
      examples: ["Write the final answer to: what is the retention money?"]
      params_schema:
        type: object
        properties:
          question: {type: string, description: "the user's question"}
        required: [question]

  # Sends an email after a human approves the draft (approval_mode internal). The supervisor plans it only when
  # the user asks to send something.
  communication:
    enabled: true
    port: 8202
    graph_id: communication
    local_graph: communication_agent.graph:graph
    local_card: communication_agent.card:CARD
    card:
      role: action
      side_effects: true
