<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifier Calls</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2129; --muted: #5f6b7a; --line: #e2e6eb;
    --accent: #2f5bd3; --ok: #1d7a46; --ok-bg: #e3f4ea; --bad: #b3261e; --bad-bg: #fbe7e5;
    --warn: #8a5a00; --warn-bg: #fdf1d8; --sel: #eaf0fd; --code: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #181c21; --text: #e4e8ee; --muted: #95a0ad; --line: #2a3038;
      --accent: #7ea2ff; --ok: #6fd39b; --ok-bg: #173324; --bad: #ff8a80; --bad-bg: #3a1c1a;
      --warn: #f3c46b; --warn-bg: #362a12; --sel: #1f2a40; --code: #1f242b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.off { background: var(--bad); }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.sel { background: var(--sel); }
  .item .q { font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
             -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .sub { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.run { color: var(--muted); background: var(--code); }
  #detail { overflow-y: auto; padding: 24px 28px; }
  .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
  h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       margin: 26px 0 10px; font-weight: 600; }
  .facts { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .facts b { color: var(--text); font-weight: 500; }
  .verdict { border-radius: 8px; padding: 14px 16px; margin-top: 18px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .verdict .t { font-weight: 600; font-size: 15px; }
  .verdict ul { margin: 6px 0 0; padding-left: 20px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 16px; margin-top: 8px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .step .head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .step .head code { font-size: 12px; }
  .res { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
  .res:first-of-type { border-top: 0; }
  .res .n { color: var(--muted); font-weight: 600; }
  .res .title { font-weight: 500; }
  .res a { color: var(--accent); font-size: 12px; word-break: break-all; text-decoration: none; }
  .res a:hover { text-decoration: underline; }
  .res .c { margin-top: 4px; }
  pre { background: var(--code); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px;
        white-space: pre-wrap; word-break: break-word; margin: 0; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #detail { padding: 18px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Verifier · /verify calls</h1>
  <div class="meta"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
</header>
<main>
  <div id="list"><div class="empty">Waiting for calls…</div></div>
  <div id="detail"><div class="empty">Calls sent to <code>POST /verify</code> show up here.</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time = (iso) => new Date(iso).toLocaleString();
let calls = [], selected = null, lastKey = "";

function badge(c) {
  if (c.error) return '<span class="badge bad">error</span>';
  if (!c.result) return '<span class="badge run">running</span>';
  return c.result.passed ? '<span class="badge ok">passed</span>' : '<span class="badge bad">failed</span>';
}

function renderList() {
  if (!calls.length) { $("list").innerHTML = '<div class="empty">Waiting for calls…</div>'; return; }
  $("list").innerHTML = calls.map((c) => `
    <div class="item ${c.id === selected ? "sel" : ""}" data-id="${c.id}">
      <div class="q">${esc(c.question || "(no question)")}</div>
      <div class="sub">${badge(c)}<span>${esc(time(c.received_at))}</span></div>
    </div>`).join("");
  document.querySelectorAll(".item").forEach((el) => el.onclick = () => { selected = el.dataset.id; renderList(); renderDetail(); });
}

function renderStep(id, out) {
  if (typeof out !== "object" || out === null) return `<div class="step"><pre>${esc(JSON.stringify(out, null, 2))}</pre></div>`;
  const findings = Array.isArray(out.findings) ? out.findings : [];
  const rows = findings.map((f, i) => typeof f === "object" && f !== null ? `
    <div class="res"><div class="n">${esc(f.rank ?? i + 1)}</div><div>
      <div class="title">${esc(f.title || "")}</div>
      ${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.url)}</a>` : ""}
      <div class="c">${esc(f.content || f.snippet || "")}</div></div></div>`
    : `<div class="res"><div class="n">${i + 1}</div><div>${esc(f)}</div></div>`).join("");
  const sources = (out.sources || []).filter((s) => !findings.some((f) => f && f.url === s));
  return `<div class="step">
    <div class="head"><code>${esc(id)}</code>${out.status ? `<span class="badge ${out.status === "ok" ? "ok" : "bad"}">${esc(out.status)}</span>` : ""}</div>
    ${rows || (out.summary ? `<pre>${esc(out.summary)}</pre>` : '<div class="empty">No findings</div>')}
    ${sources.length ? `<h3>Other sources</h3>` + sources.map((s) => `<div><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></div>`).join("") : ""}
  </div>`;
}

function renderDetail() {
  const c = calls.find((x) => x.id === selected);
  if (!c) { $("detail").innerHTML = '<div class="empty">Select a call on the left.</div>'; return; }
  const r = c.result, t = c.task || {};
  let verdict = "";
  if (c.error) verdict = `<div class="verdict bad"><div class="t">Error</div>${esc(c.error)}</div>`;
  else if (!r) verdict = `<div class="verdict"><div class="t">Running…</div></div>`;
  else verdict = `<div class="verdict ${r.passed ? "ok" : "bad"}"><div class="t">${r.passed ? "Verification passed" : "Verification failed"}</div>
      ${r.issues && r.issues.length ? "<ul>" + r.issues.map((i) => `<li>${esc(i)}</li>`).join("") + "</ul>" : ""}</div>
      ${(r.warnings || []).map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}`;
  const steps = Object.entries(t.inputs || {});
  $("detail").innerHTML = `
    <h2>${esc(c.question || "(no question)")}</h2>
    <div class="facts">
      <span>Received <b>${esc(time(c.received_at))}</b></span>
      <span>From <b>${esc(c.client)}</b></span>
      <span>Task <b>${esc(t.task_id || "-")}</b></span>
    </div>
    ${t.objective ? `<div class="facts" style="margin-top:4px"><span>Objective <b>${esc(t.objective)}</b></span></div>` : ""}
    ${verdict}
    <h3>Inputs checked (${steps.length})</h3>
    ${steps.length ? steps.map(([id, out]) => renderStep(id, out)).join("") : '<div class="empty">No inputs</div>'}
    <h3>Raw</h3>
    <details><summary>Payload received</summary><pre>${esc(JSON.stringify(c.payload, null, 2))}</pre></details>
    ${r ? `<details><summary>Result returned</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>` : ""}`;
}

async function poll() {
  try {
    const res = await fetch("/verify/calls", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    calls = await res.json();
    $("dot").classList.remove("off");
    $("status").textContent = `live · ${calls.length} call${calls.length === 1 ? "" : "s"}`;
    const key = calls.map((c) => c.id + (c.result ? "r" : "") + (c.error ? "e" : "")).join();
    if (key !== lastKey) {
      const isNew = calls[0] && !lastKey.includes(calls[0].id);
      lastKey = key;
      if (!selected || isNew) selected = calls[0] ? calls[0].id : null;
      renderList(); renderDetail();
    }
  } catch (e) {
    $("dot").classList.add("off");
    $("status").textContent = "verifier unreachable";
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
